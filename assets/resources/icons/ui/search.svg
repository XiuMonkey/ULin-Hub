<?xml version="1.0" encoding="UTF-8"?>
<!-- ULin Hub 单色线性图标：24×24、fill=none、描边纯白（#FFFFFF）、圆头/圆角。
     运行时由 LineIcon.qml / IconButton.iconColor 按亮度染色（白色 × color = color），
     所以这里不要写死主题色。设计原型见 build/temp/sidebar-redesign/index.html 顶部 <symbol id="i-search">。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="11" cy="11" r="6.5"/>
  <path d="M16 16l4.5 4.5"/>
</svg>
