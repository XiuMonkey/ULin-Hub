<?xml version="1.0" encoding="UTF-8"?>
<!-- ULin Hub 单色线性图标：24×24、fill=none、描边纯白（#FFFFFF）、圆头/圆角。
     运行时由 LineIcon.qml / IconButton.iconColor 按亮度染色，所以这里不要写死主题色。
     设计原型见 build/temp/sidebar-redesign/index.html 顶部 <symbol id="i-send">（向上箭头 = 发送）；
     停止键仍用原版 stop-btn PNG（IconButton.circleHoverOverlay 那套），不在这里做。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 19V5M6 11l6-6 6 6"/>
</svg>
