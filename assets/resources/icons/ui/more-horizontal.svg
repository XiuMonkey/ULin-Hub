<?xml version="1.0" encoding="UTF-8"?>
<!-- ULin Hub 单色线性图标：24×24、描边纯白（#FFFFFF）、圆头/圆角。
     运行时由 LineIcon.qml / IconButton.iconColor 按亮度染色，所以这里不要写死主题色。
     设计原型见 build/temp/sidebar-redesign/index.html 顶部 <symbol id="i-dots">（原型用 fill 画圆点）。
     这里刻意**不用 fill**，改成"半径 0.8 的圆 + 1.6 描边"——描边内缘正好收到圆心，
     视觉上就是实心点，同时保持整份图标集只有描边、可被同一套染色逻辑处理。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="5" cy="12" r="0.8"/>
  <circle cx="12" cy="12" r="0.8"/>
  <circle cx="19" cy="12" r="0.8"/>
</svg>
